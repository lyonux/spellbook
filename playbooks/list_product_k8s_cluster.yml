---
- hosts: kube_control_plane
  gather_facts: true
  any_errors_fatal: true
  roles:
    - { role: community/kubespray/roles/kubespray_defaults }
  tasks:
    - name: List all binary file downloads
      debug:
        msg: "{{ item.value.url }}"
      loop: "{{ downloads | dict2items }}"
      when:
        - item.value.enabled | default(false) | bool
        - item.value.file | default(false) | bool
      loop_control:
        label: "{{ item.key }}"
