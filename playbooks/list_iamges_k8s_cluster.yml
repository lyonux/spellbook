---
- hosts: kube_control_plane
  gather_facts: true
  any_errors_fatal: true
  roles:
    - { role: community/kubespray/roles/kubespray-defaults }
  tasks:
    - name: List all container images
      debug:
        msg: "{{ item.value.repo | default('N/A') }}:{{ item.value.tag | default('N/A') }}"
      loop: "{{ downloads | dict2items }}"
      when:
        - item.value.enabled | default(false) | bool
      loop_control:
        label: "{{ item.key }}"
      register: image_list
